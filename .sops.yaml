#   sops updatekeys deploy/overlays/*/secrets/*.sops.yaml
creation_rules:
  - path_regex: ^deploy/overlays/[^/]+/secrets/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
