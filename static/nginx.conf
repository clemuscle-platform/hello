# Site statique. Aucun bloc location : les add_header du server s'appliquent à toutes les réponses
# (un add_header dans un location annulerait ceux du server).
# Sondes : fichiers site/healthz et site/readyz. Cache des ressources : « expires » piloté par un map.
map $uri $static_expires {
    default                              off;
    ~*\.(css|js|png|jpg|svg|webp|woff2)$ 7d;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    expires $static_expires;
    try_files $uri $uri/ $uri.html =404;
}
