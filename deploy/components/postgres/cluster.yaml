apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP_NAME}-pg
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    app.kubernetes.io/component: postgres
    platform.io/app: ${APP_NAME}
spec:
  instances: 1
  # imageName absent : image par défaut de l'opérateur CNPG (figée par sa version).
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: app
      owner: app
  storage:
    size: 2Gi
    storageClass: ${STORAGE_CLASS}
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 384Mi}
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
      log_min_duration_statement: "500"
  inheritedMetadata:
    labels:
      platform.io/app: ${APP_NAME}
