# Module « s3 » : stockage d'objets sous le préfixe du namespace, dans le bucket des applications.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET_APPS}
      - S3_PREFIX=${APP_NAMESPACE}
patches:
  - target:
      kind: Deployment
      labelSelector: platform.io/workload=true
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef: {name: platform-s3}
  - target:
      kind: CronJob
      labelSelector: platform.io/workload=true
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/envFrom/-
        value:
          secretRef: {name: platform-s3}
