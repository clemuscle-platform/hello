apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    app.kubernetes.io/component: cron
    platform.io/app: ${APP_NAME}
    platform.io/workload: "true"
spec:
  schedule: "17 3 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ${APP_NAME}
            app.kubernetes.io/component: cron
            platform.io/app: ${APP_NAME}
        spec:
          restartPolicy: Never
          serviceAccountName: ${APP_NAME}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: app
              image: app-image
              command: ["opentelemetry-instrument", "python", "-m", "app.tasks", "cleanup"]
              envFrom:
                - configMapRef:
                    name: app-config
                - secretRef:
                    name: app-secrets
                    optional: true
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 192Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
