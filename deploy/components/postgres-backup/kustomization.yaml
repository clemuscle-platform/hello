# Sauvegardes PostgreSQL (staging et prod uniquement) : WAL continu + sauvegarde de base quotidienne,
# via le plugin Barman Cloud, vers s3://<bucket-pg>/<namespace>/ (ADR-0009).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - backup.yaml
patches:
  - target:
      kind: Cluster
      group: postgresql.cnpg.io
    patch: |
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: ${APP_NAME}-backup
